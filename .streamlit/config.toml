[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#141824"
textColor = "#F8FAFC"
font = "sans serif"

[server]
maxUploadSize = 50
headless = true

[client]
# Keep Streamlit's developer controls out of the production-facing UI.
toolbarMode = "minimal"
