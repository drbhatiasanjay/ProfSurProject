name: Test and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Run pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install torch CPU-only first (matches Dockerfile pattern, avoids 2GB GPU wheel)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cp capital_structure.db "$PROFSUR_DB_PATH"
          python scripts/check_stata_contracts.py
          python scripts/check_import_side_effects.py
          python scripts/render_capability_status.py --check
          python scripts/wave5_realdata_audit.py --source-db capital_structure.db --output /tmp/wave5-realdata-audit.json
          python -m pytest \
            tests/test_llm_adapter_import_safety.py \
            tests/test_capability_status_contract.py \
            tests/test_command_contract_docs.py \
            tests/test_automation_contracts.py \
            tests/test_wave5_independent_review_repair.py \
            -q --tb=short
          python -m pytest tests/ \
            --ignore=tests/smoke_auth.py \
            --ignore=tests/smoke_phase1.py \
            -v --tb=short
        env:
          # Disable CMIE so tests don't need secrets.toml
          ENABLE_CMIE: "false"
          PROFSUR_DB_PATH: "/tmp/profsur-ci.db"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

  ocaml:
    name: OCaml build + tests (lifecycle-ontology)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml 5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install OCaml dependencies
        run: |
          opam install dune -y
          cd lifecycle-ontology
          opam install --deps-only --with-test -y .

      - name: Build
        run: |
          cd lifecycle-ontology
          opam exec -- dune build

      - name: Run tests
        run: |
          cd lifecycle-ontology
          opam exec -- dune runtest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Write secrets.toml for Cloud Build
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lifecycle-leverage \
            --source . \
            --region us-east1 \
            --project tempproject-462219 \
            --port 8501 \
            --memory 2Gi \
            --allow-unauthenticated \
            --quiet
