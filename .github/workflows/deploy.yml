name: Test and Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.pptx'
      - '**.pdf'
      - '**.mp4'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'paper/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.pptx'
      - '**.pdf'
      - '**.mp4'
  workflow_dispatch:

jobs:
  test:
    name: Run pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install torch CPU-only first (matches Dockerfile pattern, avoids 2GB GPU wheel)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest  # pytest removed from requirements.txt (prod-only); install explicitly for CI

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/smoke_auth.py \
            --ignore=tests/smoke_phase1.py \
            -v --tb=short
        env:
          # Disable CMIE so tests don't need secrets.toml
          ENABLE_CMIE: "false"

  ocaml:
    name: OCaml build + tests (lifecycle-ontology)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for lifecycle-ontology changes
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q "^lifecycle-ontology/"; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "No changes in lifecycle-ontology. Skipping OCaml build."
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up OCaml 5.2
        if: steps.check_changes.outputs.CHANGED == 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install OCaml dependencies
        if: steps.check_changes.outputs.CHANGED == 'true'
        run: |
          opam install dune -y
          cd lifecycle-ontology
          opam install --deps-only --with-test -y .

      - name: Build
        if: steps.check_changes.outputs.CHANGED == 'true'
        run: |
          cd lifecycle-ontology
          opam exec -- dune build

      - name: Run tests
        if: steps.check_changes.outputs.CHANGED == 'true'
        run: |
          cd lifecycle-ontology
          opam exec -- dune runtest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Write secrets.toml for Cloud Build
        env:
          SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lifecycle-leverage \
            --source . \
            --region us-east1 \
            --project tempproject-462219 \
            --port 8501 \
            --memory 2Gi \
            --allow-unauthenticated \
            --quiet
