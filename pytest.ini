[pytest]
addopts = 
    -p no:napari 
    -p no:opik 
    -p no:langsmith 
    -p no:napari-plugin-engine
    -p no:npe2
    -p no:zarr
    -p no:syrupy
    --tb=short
markers =
    ui: optional authenticated browser checks for the Streamlit UI
    slow: mark test as slow running econometric or integration test
