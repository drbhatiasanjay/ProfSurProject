    - "user review and approval"
    - "deterministic authorization gate"
    - "bounded statistical executor adapter"
    - "deterministic result validator"
    - "deterministic summary plus bounded explanation"
    - "trace store and export"
  model:
    pilot_default: "gemini-2.5-flash"
    approval_status: "pending"
    fallback: "deterministic manual specification form"
  tools: "typed in-process APIs; no MCP"
  memory: "request/session state plus immutable audit trace; no long-term model memory"

