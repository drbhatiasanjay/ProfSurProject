business_objectives:
  - id: BO-01
    objective: "Convert a natural-language statistical request into an explicit, reviewable specification."
    measure: "method, variable-role, and option accuracy on the approved golden set"
  - id: BO-02
    objective: "Prevent unsupported, ambiguous, unapproved, or stale specifications from executing."
    measure: "zero critical authorization bypasses or unsupported substitutions"
  - id: BO-03
    objective: "Produce validated, responsibly explained OLS and fixed-effects results."
    measure: "statistical parity, warning completeness, and explanation-policy compliance"
  - id: BO-04
    objective: "Preserve traceability from original request to final output."
    measure: "100 percent required trace-field completeness"

actors:
  - id: researcher
    type: human
    responsibilities: ["state intent", "answer clarification", "approve specification", "review result"]
  - id: statistical_method_owner
    type: human
    responsibilities: ["approve method policy", "approve thresholds", "review escalations"]
  - id: product_owner
    type: human
    responsibilities: ["approve scope", "own KPIs", "approve release"]
  - id: data_owner
    type: human
    responsibilities: ["own variable catalog", "approve data use"]
  - id: security_privacy_owner
    type: human
    responsibilities: ["approve provider", "approve retention and logging"]
  - id: profsur_application
    type: system
    responsibilities: ["workflow UI", "session context", "trace presentation"]
  - id: intent_parser
    type: llm_assisted_component
    responsibilities: ["draft typed specification", "report uncertainty"]
    prohibited: ["authorize", "execute", "silently substitute methods"]
  - id: deterministic_policy_gate
    type: system
    responsibilities: ["clarify", "validate", "authorize approved immutable specifications"]
  - id: statistical_executor
    type: system
    responsibilities: ["execute bounded OLS and fixed-effects contracts"]
  - id: result_validator
    type: system
    responsibilities: ["verify fidelity", "verify result integrity", "derive release status"]

requirements:
  functional:
    - id: FR-001
      statement: "Preserve original request and active dataset/filter context immutably."
    - id: FR-002
      statement: "Produce a schema-constrained statistical specification draft with unresolved fields."
    - id: FR-003
      statement: "Ask targeted clarification for incomplete or ambiguous required fields."
    - id: FR-004
      statement: "Validate method, dependent variable, predictors, controls, fixed effects, panel variables, clustering, filters, and missingness."
    - id: FR-005
      statement: "Display exact normalized specification and reproducible representation before execution."
    - id: FR-006
      statement: "Require authenticated explicit approval bound to specification and dataset/filter hashes."
    - id: FR-007
      statement: "Execute only allowlisted OLS or fixed-effects specifications."
    - id: FR-008
      statement: "Validate result and requested-versus-executed equivalence before explanation."
    - id: FR-009
      statement: "Display user-visible warnings, errors, recovery actions, and statistically responsible explanation."
    - id: FR-010
      statement: "Export a trace linking request, revisions, approval, execution, result, validation, and explanation."
  statistical:
    - id: SR-001
      statement: "Support OLS and fixed-effects regression only in the initial slice."
    - id: SR-002
      statement: "Represent company effects, year effects, and clustering as independent explicit fields."
    - id: SR-003
      statement: "Disclose complete-case exclusions and sample counts."
    - id: SR-004
      statement: "Detect invalid/unknown variables, duplicates in panel keys, insufficient sample/groups/clusters, constant terms, rank failure, collinearity, and absorbed terms."
    - id: SR-005
      statement: "Never substitute an unsupported method or covariance estimator."
    - id: SR-006
      statement: "Distinguish association from causation and prohibit unsupported causal interpretation."
  non_functional:
    - id: NFR-001
      statement: "Fail closed at schema, validation, authorization, execution, and result-validation boundaries."
    - id: NFR-002
      statement: "Use least privilege and do not expose arbitrary code or SQL to the language model."
    - id: NFR-003
      statement: "Provide keyboard-operable, non-color-only warning/error states with accessible labels."
    - id: NFR-004
      statement: "Correlate all stages with stable identifiers and redact sensitive telemetry."
    - id: NFR-005
      statement: "Provide feature-flag rollback to current direct workflows."

scenarios:
  sunny_day:
    - id: SD-01
      name: "Explicit OLS"
      expected: "validate, approve, execute, explain, trace"
    - id: SD-02
      name: "Two-way fixed effects clustered by company"
      expected: "validate panel/effects/cluster, approve, execute, disclose omissions and diagnostics"
    - id: SD-03
      name: "Incomplete method/options"
      expected: "ask focused clarification then continue"
    - id: SD-04
      name: "Reproducibility review"
      expected: "show and export full request-to-output chain"
  rainy_day:
    - id: RD-01
      name: "Ambiguous variable"
      expected: "no guess; candidate selection required"
    - id: RD-02
      name: "Unsupported method"
      expected: "refuse without substitution"
    - id: RD-03
      name: "Invalid panel or cluster"
      expected: "block with correction guidance"
    - id: RD-04
      name: "Material missingness"
      expected: "disclose and require approval of resulting sample"
    - id: RD-05
      name: "Insufficient observations or clusters"
      expected: "block under approved policy"
    - id: RD-06
      name: "Collinear or absorbed requested term"
      expected: "warning or block and reapproval according to policy"
    - id: RD-07
      name: "Malformed or unavailable model"
      expected: "reject draft and offer deterministic form"
    - id: RD-08
      name: "Execution failure"
      expected: "no partial interpretation; safe idempotent retry"
    - id: RD-09
      name: "Unsupported causal request"
      expected: "state associational boundary"
    - id: RD-10
      name: "Control-bypass prompt"
      expected: "refuse arbitrary execution and record policy event"

constraints:
  source_reuse:
    - "existing Streamlit application shell"
    - "existing authenticated session and chat persistence"
    - "active panel dataset and filters"
    - "existing bounded Stata/econometric engine"
    - "provider-neutral validation-ledger vocabulary"
  initial_scope:
    methods: ["ols", "fixed_effects"]
    fixed_effects: ["company", "year"]
    covariance: ["conventional_for_ols_if_explicitly_approved", "hc1_robust_ols", "company_clustered"]
    languages: ["English"]
  exclusions:
    - "IV"
    - "GMM"
    - "difference-in-differences"
    - "automatic model selection"
    - "causal inference automation"
    - "arbitrary code or SQL"
    - "MCP"
    - "long-term memory"
    - "RAG or GraphRAG"
    - "multi-agent system"
    - "Kubernetes migration"
    - "platform rewrite"
  deployment: "retain current Streamlit container on Cloud Run"
  data_minimization: "send schema metadata and bounded result summaries to the model; raw rows excluded by default"

selected_architecture:
  style: "typed deterministic workflow with bounded LLM assistance"
  agency_level: "LLM-assisted workflow"
  components:
