# cloudbuild.yaml — fast app-code-only builds using pre-built base image.
# Used automatically by: gcloud run deploy lifecycle-leverage --source . ...
#
# Strategy: Dockerfile now uses FROM lifecycle-leverage-base (all pip deps pre-baked).
# This build only runs COPY . . — typically <30s.
# Rebuild base when requirements.txt changes:
#   gcloud builds submit --config cloudbuild.base.yaml . --project tempproject-462219

substitutions:
  _CACHE_IMAGE: 'us-east1-docker.pkg.dev/tempproject-462219/cloud-run-source-deploy/lifecycle-leverage:latest'

steps:
  # 1. Pull previous image for COPY . . layer caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull $_CACHE_IMAGE || true']

  # 2. Build — base image has all deps; only app code layer rebuilds
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--cache-from'
      - '$_CACHE_IMAGE'
      - '-t'
      - '$_IMAGE_NAME'
      - '-t'
      - '$_CACHE_IMAGE'
      - .

  # 3. Push versioned image (Cloud Run deploys this)
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_IMAGE_NAME']

  # 4. Push :latest as cache for next build
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '$_CACHE_IMAGE']

images:
  - '$_IMAGE_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
